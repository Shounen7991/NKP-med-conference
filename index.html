<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Medical Conference Booking</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      z-index: 10;
    }

    .loading.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="loading" id="loading">
    Opening Medical Conference Booking...
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbz43EUcJELaB9Jt_PtsmxPjhDXBZ2I0CJnA8hXVcGXeeqTTo2ubwocsfaw1GARbpQ6v/exec"
    allow="fullscreen">
  </iframe>

  <script>
    const iframe = document.getElementById("app");
    const loading = document.getElementById("loading");

    iframe.addEventListener("load", function () {
      loading.classList.add("hidden");
    });
  </script>

</body>
</html>
